name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows 11 (.exe)
    runs-on: windows-2025
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-build.txt

      - name: Gerar aplicação
        run: pyinstaller --noconfirm --clean --windowed --name VisionHub --collect-all cv2 --add-data ".env.example;." main.py

      - name: Gerar instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\VisionHub.iss'

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: VisionHub-Windows-Setup
          path: installer/output/VisionHub-Windows-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-15
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-build.txt

      - name: Gerar aplicativo
        run: pyinstaller --noconfirm --clean --windowed --name VisionHub --collect-all cv2 --add-data ".env.example:." main.py

      - name: Gerar imagem DMG
        run: hdiutil create -volname VisionHub -srcfolder dist/VisionHub.app -ov -format UDZO dist/VisionHub-macOS.dmg

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: VisionHub-macOS
          path: dist/VisionHub-macOS.dmg
          if-no-files-found: error
